# TIES-Merging with drop ratio d=0.7 over the three single-source LRD checkpoints.
# Replace `xxx` with your HF org / namespace.
models:
  - model: xxx/CMB_A          # xxx = your HF org; CMB_A = academic-only LRD checkpoint
    parameters:
      density: 0.7
      weight: 1.0
  - model: xxx/CMB_F          # xxx = your HF org; CMB_F = FineWeb-only LRD checkpoint
    parameters:
      density: 0.7
      weight: 1.0
  - model: xxx/CMB_S          # xxx = your HF org; CMB_S = synthetic-only LRD checkpoint
    parameters:
      density: 0.7
      weight: 1.0
merge_method: ties
base_model: xxx/CMB_Base      # xxx = your HF org; CMB_Base = stable-phase ModernBERT-base init
parameters:
  normalize: true
dtype: bfloat16
