name: Deploy project website

# Builds site/ with Astro and publishes it to GitHub Pages.
# Enable once under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "paper/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The site does not need third_party/, and skipping submodules keeps
        # the build from depending on an external repository staying reachable.
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Typecheck
        working-directory: site
        run: npm run check

      - name: Build
        working-directory: site
        # `base` is set to /ClimateModernBERT in astro.config.mjs, which matches
        # the repository name. Rename the repo and that value must change too.
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
